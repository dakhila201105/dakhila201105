name: Update contribution city

on:
  schedule:
    - cron: '17 21 * * *' # 02:47 IST; GitHub may delay scheduled runs
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/profile-3d.yml'

permissions:
  contents: write

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
      - name: Generate 3D contribution images
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit updated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo 'Contribution images already current.'
            exit 0
          fi
          git commit -m 'Update 3D contribution calendar'
          git push
